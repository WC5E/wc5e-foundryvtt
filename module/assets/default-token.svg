<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3a1c16"/>
      <stop offset="55%" stop-color="#1c0d0a"/>
      <stop offset="100%" stop-color="#0a0605"/>
    </radialGradient>
    <linearGradient id="claw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d08a"/>
      <stop offset="45%" stop-color="#c8863b"/>
      <stop offset="100%" stop-color="#8f4a1e"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- token field -->
  <circle cx="256" cy="256" r="246" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="246" fill="none" stroke="#0a0605" stroke-width="8"/>
  <circle cx="256" cy="256" r="234" fill="none" stroke="#c8863b" stroke-width="6" opacity="0.85"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#5a2f18" stroke-width="2" opacity="0.7"/>

  <!-- three claw slashes -->
  <g filter="url(#sh)" transform="rotate(-16 256 256)">
    <path fill="url(#claw)" d="M176 120
      C 236 196, 258 312, 226 404
      C 224 306, 212 200, 158 128 Z"/>
    <path fill="url(#claw)" d="M256 104
      C 320 188, 344 314, 310 414
      C 308 310, 296 196, 236 112 Z"/>
    <path fill="url(#claw)" d="M336 120
      C 396 196, 418 312, 386 404
      C 384 306, 372 200, 318 128 Z"/>
  </g>
</svg>
