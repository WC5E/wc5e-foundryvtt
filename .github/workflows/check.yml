name: Check

# The gate. `verify` matters more here than the tests do: almost everything it
# checks fails *silently* in Foundry rather than erroring -- a broken advancement
# grant is a no-op on level-up, an unregistered spell list is inert, a missing
# asset is a blank token. None of that shows up in review, and often not in play
# until a session stops.
#
# verify.py is Python stdlib and the tests are stdlib plus node:test; the only
# dependency is the Foundry CLI, used to read the compiled packs back out and
# confirm they match src/.

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Only the Foundry CLI, and only so the packs can be read back out.
      - run: npm ci

      # Every internal reference resolves, every asset exists on disk, every
      # spell list is registered, every spell is reachable from a class list,
      # and the packs are a fresh compile rather than something a running
      # Foundry wrote to.
      - name: Verify
        run: npm run verify

      # verify reads src/. This reads the compiled packs back out and checks
      # they still contain it -- editing a document and forgetting
      # `npm run pack` otherwise passes everything and ships stale content,
      # because the release zip is packs/ exactly as committed.
      - name: Packs match src
        run: npm run check-packs

      - name: Tests
        run: npm test
